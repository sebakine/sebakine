# Genera el gráfico animado de contribuciones con la paleta del perfil
# y lo publica en la rama "output" (la usa el README).
name: Gráfico de contribuciones

on:
  schedule:
    - cron: "17 6 * * *" # todos los días, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#B5612C&color_dots=#EDE1D3,#E8C9A6,#D9A46F,#C07A3E,#8A4A1E
            dist/snake-dark.svg?color_snake=#E3894C&color_dots=#241B16,#4A3426,#7A5233,#B07444,#E3894C

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: actualizar gráfico de contribuciones"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
