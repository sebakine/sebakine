# Genera el gráfico animado de contribuciones con la paleta del perfil
# y lo publica en la rama "output" (la usa el README).
name: Gráfico de contribuciones

on:
  schedule:
    - cron: "17 6 * * *" # todos los días, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#7A3E12&color_dots=#EFE4D6,#E5C29B,#D49A62,#B86F35,#8A4A1E
            dist/snake-dark.svg?color_snake=#E8B86A&color_dots=#2B211B,#5A3C28,#8A5A35,#C07A45,#F0A060

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: actualizar gráfico de contribuciones"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
